name: Build DBS Actros image

on:
  push:
    paths:
      - ".github/workflows/build-dbs-actros.yml"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild exact truck image
        shell: bash
        run: |
          mkdir -p images
          cat             .asset-chunks/dbs-actros-01.txt             .asset-chunks/dbs-actros-02.txt             .asset-chunks/dbs-actros-03.txt             .asset-chunks/dbs-actros-04.txt             .asset-chunks/dbs-actros-05.txt             .asset-chunks/dbs-actros-06.txt             .asset-chunks/dbs-actros-07.txt             | tr -d '\n\r'             | base64 --decode > images/dbs-actros.webp
          test -s images/dbs-actros.webp
          file images/dbs-actros.webp
          test "$(wc -c < images/dbs-actros.webp)" -gt 25000

      - name: Commit binary image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/dbs-actros.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add exact DBS Actros truck image"
          git push origin HEAD:main
